<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Flipit — Split-Flap Display</title>
<style>
  :root {
    /* Premium "Solari" dark theme */
    --bg-0: #0a0a0c;
    --bg-1: #141417;
    --card-top: #2c2d31;
    --card-top-2: #232428;
    --card-bot: #1b1c1f;
    --card-bot-2: #141518;
    --glyph: #f4f4f5;
    --glyph-shadow: rgba(0,0,0,.55);
    --hinge: #050506;
    --hinge-hi: rgba(255,255,255,.06);
    --accent: #e8b84b;
    --ui: rgba(255,255,255,.78);
    --ui-dim: rgba(255,255,255,.42);
    --ui-panel: rgba(20,20,24,.86);
    --ui-border: rgba(255,255,255,.10);
    --font: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  /* Light palettes adjust only the UI chrome for contrast.
     Board colors (bg/card/glyph/accent) are set per-palette in JS. */
  body.light {
    --ui: rgba(20,20,24,.86);
    --ui-dim: rgba(20,20,24,.5);
    --ui-panel: rgba(248,248,250,.92);
    --ui-border: rgba(0,0,0,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% -10%, var(--bg-1), var(--bg-0) 70%);
    color: var(--ui);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  body.idle { cursor: none; }

  /* ---------- Stage ---------- */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 4vw, 64px);
  }

  /* ---------- Flip board ---------- */
  .board {
    --persp: 400px;
    display: flex;
    flex-direction: column;
    gap: 0.16em;
    align-items: center;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.5));
  }
  .row { display: flex; gap: 0.09em; }

  .unit {
    position: relative;
    width: 0.78em;
    height: 1.12em;
    perspective: var(--persp);
    flex: 0 0 auto;
  }
  .unit.sep {
    width: 0.4em;
    perspective: none;
  }
  .unit.sep .card { background: transparent !important; box-shadow: none !important; }
  .unit.sep::after { display: none; }

  .card {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .card .char {
    position: absolute;
    left: 0;
    width: 100%;
    height: 200%;   /* full unit height */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82em;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--glyph);
    text-shadow: 0 1px 1px var(--glyph-shadow);
  }

  /* top halves */
  .card.top, .card.flap-top {
    top: 0;
    border-radius: 0.08em 0.08em 0 0;
    background: linear-gradient(180deg, var(--card-top), var(--card-top-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
  }
  .card.top .char, .card.flap-top .char { top: 0; }

  /* bottom halves */
  .card.bottom, .card.flap-bottom {
    bottom: 0;
    border-radius: 0 0 0.08em 0.08em;
    background: linear-gradient(180deg, var(--card-bot), var(--card-bot-2));
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.45);
  }
  .card.bottom .char, .card.flap-bottom .char { top: -100%; }

  /* hinge line */
  .unit::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: calc(50% - 1px);
    height: 2px;
    background: linear-gradient(180deg, var(--hinge), var(--hinge-hi));
    z-index: 6;
    border-radius: 1px;
    pointer-events: none;
  }

  /* flaps (animated) */
  .flap {
    z-index: 5;
    visibility: hidden;
  }
  .flap-top { transform-origin: 50% 100%; }
  .flap-bottom { transform-origin: 50% 0%; transform: rotateX(90deg); }

  /* shading overlay on flaps for depth */
  .flap::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    opacity: 0;
  }
  .flap-top::before { background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.55)); }
  .flap-bottom::before { background: linear-gradient(0deg, rgba(0,0,0,0), rgba(0,0,0,.5)); }

  .unit.flipping .flap { visibility: visible; }
  .unit.flipping .flap-top {
    animation: flipTop var(--half, 110ms) cubic-bezier(.36,0,.66,-0.05) forwards;
  }
  .unit.flipping .flap-top::before {
    animation: shadeTop var(--half, 110ms) ease-in forwards;
  }
  .unit.flipping .flap-bottom {
    animation: flipBottom var(--half, 110ms) cubic-bezier(.34,1.2,.64,1) var(--half, 110ms) forwards;
  }
  .unit.flipping .flap-bottom::before {
    animation: shadeBottom var(--half, 110ms) ease-out var(--half, 110ms) forwards;
  }

  @keyframes flipTop {
    0% { transform: rotateX(0deg); }
    100% { transform: rotateX(-90deg); }
  }
  @keyframes flipBottom {
    0% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
  @keyframes shadeTop { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes shadeBottom { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- Caption ---------- */
  #caption {
    position: fixed;
    bottom: clamp(16px, 5vh, 48px);
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ui-dim);
    pointer-events: none;
    transition: opacity .4s ease;
  }

  /* ---------- Controls ---------- */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px clamp(16px, 3vw, 32px);
    z-index: 20;
    transition: opacity .4s ease, transform .4s ease;
  }
  body.idle #topbar, body.idle #caption { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  body.idle #caption { transform: translateY(8px); }

  .seg {
    display: inline-flex;
    background: var(--ui-panel);
    border: 1px solid var(--ui-border);
    border-radius: 999px;
    padding: 4px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ui-dim);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s, background .2s;
    white-space: nowrap;
  }
  .seg button:hover { color: var(--ui); }
  .seg button.active { background: var(--accent); color: #1a1408; }

  .tools { display: flex; gap: 8px; }
  .icon-btn {
    appearance: none;
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--ui-border);
    background: var(--ui-panel);
    color: var(--ui);
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background .2s, color .2s, transform .1s;
  }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,.14); }
  body.light .icon-btn:hover { color: #000; background: rgba(0,0,0,.08); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.on { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; display: block; }

  /* ---------- Settings panel ---------- */
  #panel {
    position: fixed;
    top: 72px;
    right: clamp(16px, 3vw, 32px);
    width: min(340px, calc(100vw - 32px));
    background: var(--ui-panel);
    border: 1px solid var(--ui-border);
    border-radius: 18px;
    padding: 20px;
    z-index: 25;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
    transform-origin: top right;
    transition: opacity .2s ease, transform .2s ease;
  }
  #panel.hidden { opacity: 0; transform: scale(.96) translateY(-6px); pointer-events: none; }
  #panel h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .18em;
    color: var(--ui-dim); margin-bottom: 14px; font-weight: 700;
  }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field > label {
    display: block; font-size: 13px; font-weight: 600;
    margin-bottom: 8px; color: var(--ui);
  }
  .field input[type="text"],
  .field input[type="datetime-local"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    background: rgba(0,0,0,.25);
    border: 1px solid var(--ui-border);
    border-radius: 10px;
    color: var(--ui);
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s;
  }
  body.light .field input,
  body.light .field textarea { background: rgba(255,255,255,.6); }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 72px; line-height: 1.4; }
  .row-2 { display: flex; gap: 10px; }
  .row-2 > .field { flex: 1; margin-bottom: 0; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0;
  }
  .toggle-row span { font-size: 14px; font-weight: 500; }
  .switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(255,255,255,.18); transition: background .2s; cursor: pointer;
  }
  .switch .track::before {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(18px); }

  .seg.small { width: 100%; }
  .seg.small button { flex: 1; text-align: center; padding: 8px 0; }

  .btn-primary {
    width: 100%;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #1a1408;
    font: inherit; font-weight: 700; font-size: 14px;
    padding: 11px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(.98); }

  .hint { font-size: 12px; color: var(--ui-dim); margin-top: 6px; line-height: 1.4; }

  /* ---------- Palette popover ---------- */
  #palettePop {
    position: fixed;
    top: 64px;
    right: clamp(16px, 3vw, 32px);
    width: min(296px, calc(100vw - 32px));
    background: var(--ui-panel);
    border: 1px solid var(--ui-border);
    border-radius: 18px;
    padding: 18px;
    z-index: 26;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
    transform-origin: top right;
    transition: opacity .2s ease, transform .2s ease;
  }
  #palettePop.hidden { opacity: 0; transform: scale(.96) translateY(-6px); pointer-events: none; }
  #palettePop h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .18em;
    color: var(--ui-dim); margin-bottom: 14px; font-weight: 700;
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .swatch {
    position: relative;
    aspect-ratio: 1;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    overflow: hidden;
    transition: transform .12s, border-color .15s;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 4px 10px rgba(0,0,0,.25);
  }
  .swatch:hover { transform: translateY(-2px) scale(1.04); }
  .swatch.active { border-color: var(--sw-accent, #fff); }
  .swatch .sw-glyph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
    color: var(--sw-glyph);
  }
  .swatch .sw-hinge {
    position: absolute; left: 0; right: 0; top: calc(50% - 1px);
    height: 2px; background: rgba(0,0,0,.35);
  }
  .swatch .sw-dot {
    position: absolute; right: 4px; bottom: 4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sw-accent);
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.25);
  }
  .swatch .sw-name {
    /* accessible label only */
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  }

  /* ---------- Export / share popover ---------- */
  #exportPop {
    position: fixed;
    top: 64px;
    right: clamp(16px, 3vw, 32px);
    width: min(380px, calc(100vw - 32px));
    background: var(--ui-panel);
    border: 1px solid var(--ui-border);
    border-radius: 18px;
    padding: 20px;
    z-index: 26;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
    transform-origin: top right;
    transition: opacity .2s ease, transform .2s ease;
    max-height: calc(100vh - 88px);
    overflow: auto;
  }
  #exportPop.hidden { opacity: 0; transform: scale(.96) translateY(-6px); pointer-events: none; }
  #exportPop h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .18em;
    color: var(--ui-dim); margin-bottom: 16px; font-weight: 700;
  }
  .export-section { margin-bottom: 20px; }
  .export-section:last-child { margin-bottom: 0; }
  .export-label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .code-box {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.5;
    background: rgba(0,0,0,.28);
    border: 1px solid var(--ui-border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ui);
    word-break: break-all;
    max-height: 92px;
    overflow: auto;
  }
  body.light .code-box { background: rgba(255,255,255,.55); }
  .btn-ghost {
    margin-top: 8px;
    width: 100%;
    border: 1px solid var(--ui-border);
    background: transparent;
    color: var(--ui);
    font: inherit; font-weight: 600; font-size: 13px;
    padding: 9px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,.08); border-color: var(--accent); }
  body.light .btn-ghost:hover { background: rgba(0,0,0,.05); }
  .btn-ghost.copied { color: var(--accent); border-color: var(--accent); }

  /* ---------- Embed mode (chrome-free board) ---------- */
  body.embed { background: var(--bg-0); }
  body.embed #topbar,
  body.embed #caption,
  body.embed #palettePop,
  body.embed #panel,
  body.embed #exportPop { display: none !important; }
  body.embed #stage { padding: clamp(10px, 4vw, 28px); }

  @media (max-width: 560px) {
    #topbar { flex-wrap: wrap; }
    .seg button { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div id="stage"><div class="board" id="board"></div></div>
  <div id="caption"></div>

  <div id="topbar">
    <div class="seg" id="modes">
      <button data-mode="clock" class="active">Clock</button>
      <button data-mode="countdown">Countdown</button>
      <button data-mode="message">Message</button>
    </div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" title="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Color palette">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="17.5" cy="10.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="6.5" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><path d="M12 2a10 10 0 1 0 0 20 2.5 2.5 0 0 0 2-4 2.5 2.5 0 0 1 2-4h2a4 4 0 0 0 4-4 10 10 0 0 0-10-8z"/></svg>
      </button>
      <button class="icon-btn" id="fsBtn" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button class="icon-btn" id="gearBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="exportBtn" title="Export &amp; share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="8 7 12 3 16 7"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>

  <div id="palettePop" class="hidden">
    <h3>Palette</h3>
    <div class="swatches" id="swatches"></div>
  </div>

  <div id="exportPop" class="hidden">
    <h3>Export &amp; Share</h3>
    <div class="export-section">
      <div class="export-label">Shareable link</div>
      <div class="code-box" id="shareLink"></div>
      <button class="btn-ghost" data-copy="shareLink">Copy link</button>
    </div>
    <div class="export-section">
      <div class="export-label">Embed widget</div>
      <div class="code-box" id="embedCode"></div>
      <button class="btn-ghost" data-copy="embedCode">Copy embed code</button>
    </div>
    <div class="export-section">
      <div class="export-label">Image</div>
      <button class="btn-primary" id="downloadImg">Download PNG</button>
      <div class="hint">Captures the board exactly as shown, in the current palette.</div>
    </div>
  </div>

  <div id="panel" class="hidden">
    <!-- Clock settings -->
    <div data-panel="clock">
      <h3>Clock</h3>
      <div class="field">
        <label>Format</label>
        <div class="seg small" id="clockFormat">
          <button data-v="24" class="active">24-hour</button>
          <button data-v="12">12-hour</button>
        </div>
      </div>
      <div class="field">
        <div class="toggle-row">
          <span>Show seconds</span>
          <label class="switch"><input type="checkbox" id="clockSeconds" checked><span class="track"></span></label>
        </div>
      </div>
    </div>

    <!-- Countdown settings -->
    <div data-panel="countdown" style="display:none">
      <h3>Countdown</h3>
      <div class="field">
        <label>Target date &amp; time</label>
        <input type="datetime-local" id="cdTarget">
        <div class="hint">Or set a quick duration below.</div>
      </div>
      <div class="row-2">
        <div class="field"><label>Hours</label><input type="number" id="cdH" min="0" value="0"></div>
        <div class="field"><label>Min</label><input type="number" id="cdM" min="0" value="10"></div>
        <div class="field"><label>Sec</label><input type="number" id="cdS" min="0" value="0"></div>
      </div>
      <div class="field">
        <label>Label when finished</label>
        <input type="text" id="cdDone" value="TIMES UP" maxlength="20">
      </div>
      <button class="btn-primary" id="cdStart">Start countdown</button>
    </div>

    <!-- Message settings -->
    <div data-panel="message" style="display:none">
      <h3>Message</h3>
      <div class="field">
        <label>Text</label>
        <textarea id="msgText" maxlength="240" placeholder="Type a message…">HELLO WORLD</textarea>
        <div class="hint">Letters, numbers &amp; . , : ' ! ? - / are supported. Use Enter for new lines.</div>
      </div>
      <button class="btn-primary" id="msgShow">Display</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // Ordered "alphabet" available on every flap. Anything else renders as blank.
  const CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:'!?-/&@#%+°";
  const VALID = new Set(CHARS.split(""));
  const HALF_MS = 70; // half-flip duration (one fold = 2x this)

  // Characters shown during the airport-style "flutter" before a cell settles.
  const FLAP_POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  function randGlyph(exclude) {
    let c;
    do { c = FLAP_POOL[Math.floor(Math.random() * FLAP_POOL.length)]; }
    while (c === exclude);
    return c;
  }

  // ---------- Color palettes ----------
  // `light: true` flips the UI chrome (controls/panels) to dark-on-light.
  const PALETTES = {
    onyx: { name: "Onyx", light: false, vars: {
      "bg-0":"#0a0a0c","bg-1":"#141417","card-top":"#2c2d31","card-top-2":"#232428",
      "card-bot":"#1b1c1f","card-bot-2":"#141518","glyph":"#f4f4f5","glyph-shadow":"rgba(0,0,0,.55)",
      "hinge":"#050506","hinge-hi":"rgba(255,255,255,.06)","accent":"#e8b84b" } },
    slate: { name: "Slate", light: false, vars: {
      "bg-0":"#0d0f12","bg-1":"#161a20","card-top":"#2b313b","card-top-2":"#222730",
      "card-bot":"#191d24","card-bot-2":"#11141a","glyph":"#f0f3f7","glyph-shadow":"rgba(0,0,0,.5)",
      "hinge":"#04060a","hinge-hi":"rgba(255,255,255,.07)","accent":"#7dd3fc" } },
    midnight: { name: "Midnight", light: false, vars: {
      "bg-0":"#060a14","bg-1":"#0c1426","card-top":"#1c2a44","card-top-2":"#152135",
      "card-bot":"#101a2c","card-bot-2":"#0a1220","glyph":"#eaf0ff","glyph-shadow":"rgba(0,0,0,.55)",
      "hinge":"#03060d","hinge-hi":"rgba(120,160,255,.1)","accent":"#4d8dff" } },
    forest: { name: "Forest", light: false, vars: {
      "bg-0":"#060c08","bg-1":"#0c160f","card-top":"#1d2e22","card-top-2":"#16241a",
      "card-bot":"#111d15","card-bot-2":"#0b140e","glyph":"#eefaf0","glyph-shadow":"rgba(0,0,0,.55)",
      "hinge":"#030704","hinge-hi":"rgba(120,220,150,.1)","accent":"#46c97e" } },
    crimson: { name: "Crimson", light: false, vars: {
      "bg-0":"#120607","bg-1":"#1f0c0e","card-top":"#3a1f23","card-top-2":"#2d181b",
      "card-bot":"#221215","card-bot-2":"#160b0d","glyph":"#fff0f1","glyph-shadow":"rgba(0,0,0,.55)",
      "hinge":"#0a0405","hinge-hi":"rgba(255,140,150,.1)","accent":"#ff5d6c" } },
    synthwave: { name: "Synthwave", light: false, vars: {
      "bg-0":"#0c0618","bg-1":"#160a2b","card-top":"#2a1a45","card-top-2":"#201338",
      "card-bot":"#190f2c","card-bot-2":"#100820","glyph":"#fdeaff","glyph-shadow":"rgba(0,0,0,.5)",
      "hinge":"#060312","hinge-hi":"rgba(255,120,220,.12)","accent":"#f062d6" } },
    amber: { name: "Amber", light: false, vars: {
      "bg-0":"#0a0805","bg-1":"#14100a","card-top":"#2a2118","card-top-2":"#201910",
      "card-bot":"#181208","card-bot-2":"#0f0b05","glyph":"#ffb627","glyph-shadow":"rgba(0,0,0,.6)",
      "hinge":"#000000","hinge-hi":"rgba(255,180,40,.12)","accent":"#ffb627" } },
    departures: { name: "Departures", light: true, vars: {
      "bg-0":"#d9dadd","bg-1":"#c4c5c9","card-top":"#fbfbfc","card-top-2":"#ececed",
      "card-bot":"#e3e3e5","card-bot-2":"#d3d3d6","glyph":"#18181b","glyph-shadow":"rgba(0,0,0,.12)",
      "hinge":"rgba(0,0,0,.28)","hinge-hi":"rgba(255,255,255,.7)","accent":"#d9952a" } },
    paper: { name: "Paper", light: true, vars: {
      "bg-0":"#e9e2d4","bg-1":"#d8cdb8","card-top":"#fdfaf3","card-top-2":"#f1e9da",
      "card-bot":"#e7ddcb","card-bot-2":"#d7cab2","glyph":"#2a2118","glyph-shadow":"rgba(0,0,0,.1)",
      "hinge":"rgba(0,0,0,.22)","hinge-hi":"rgba(255,255,255,.75)","accent":"#c2752a" } },
    mint: { name: "Mint", light: true, vars: {
      "bg-0":"#dfeae5","bg-1":"#cadbd3","card-top":"#fbfdfc","card-top-2":"#e9f2ee",
      "card-bot":"#dde9e4","card-bot-2":"#ccddd6","glyph":"#103a2c","glyph-shadow":"rgba(0,0,0,.1)",
      "hinge":"rgba(0,0,0,.22)","hinge-hi":"rgba(255,255,255,.7)","accent":"#0fa672" } },
  };
  const PALETTE_KEYS = Object.keys(PALETTES);

  // ---------- Flip unit ----------
  class Unit {
    constructor(isSep = false) {
      this.isSep = isSep;
      this.current = " ";
      this.queue = [];
      this.next = " ";
      this.flipping = false;

      const el = document.createElement("div");
      el.className = "unit" + (isSep ? " sep" : "");
      el.innerHTML = `
        <div class="card top"><div class="char"></div></div>
        <div class="card bottom"><div class="char"></div></div>
        <div class="card flap flap-top"><div class="char"></div></div>
        <div class="card flap flap-bottom"><div class="char"></div></div>`;
      this.el = el;
      this.topC = el.querySelector(".top .char");
      this.botC = el.querySelector(".bottom .char");
      this.fTop = el.querySelector(".flap-top .char");
      this.fBot = el.querySelector(".flap-bottom .char");
      this.flapBottom = el.querySelector(".flap-bottom");

      this.flapBottom.addEventListener("animationend", () => this.finish());
      this.setStatic(" ");
    }
    setStatic(ch) {
      this.topC.textContent = ch;
      this.botC.textContent = ch;
    }
    // steps = total flips to reach the target. 1 = a single clean flip
    // (clock/countdown). >1 = airport flutter through random characters.
    set(ch, steps = 1) {
      ch = ch.toUpperCase();
      if (!VALID.has(ch)) ch = " ";
      if (this.isSep) { this.current = ch; this.setStatic(ch); return; }
      if (ch === this.current && !this.flipping && this.queue.length === 0) return;

      // Build the sequence of characters to flap through, ending on the target.
      const seq = [];
      let last = this.flipping ? this.next : this.current;
      for (let i = 0; i < steps - 1; i++) { const r = randGlyph(last); seq.push(r); last = r; }
      seq.push(ch);
      this.queue = seq;

      if (!this.flipping) this.advance();
    }
    advance() {
      this.flip(this.queue.shift());
    }
    flip(target) {
      this.flipping = true;
      this.next = target;
      // top static reveals the NEW top as the flap folds away
      this.topC.textContent = target;
      // bottom static keeps showing OLD until the bottom flap lands
      this.botC.textContent = this.current;
      // flaps
      this.fTop.textContent = this.current;
      this.fBot.textContent = target;
      // restart animation
      this.el.classList.remove("flipping");
      void this.el.offsetWidth;
      this.el.classList.add("flipping");
      if (window.__flipSound) window.__flipSound();
    }
    finish() {
      this.botC.textContent = this.next;
      this.current = this.next;
      this.el.classList.remove("flipping");
      this.flipping = false;
      if (this.queue.length) this.advance();
    }
  }

  // ---------- Board ----------
  class Board {
    constructor(root) {
      this.root = root;
      this.rows = [];        // array of arrays of Unit
      this.layoutKey = "";
      this.maxCols = 0;
    }
    // lines: array of strings; sepCols: Set of column indices that are separators (single row only)
    setLayout(lines, sepCols = null) {
      const key = lines.map(l => l.length).join("x") + "|" + (sepCols ? [...sepCols].join(",") : "");
      if (key === this.layoutKey) return false;
      this.layoutKey = key;
      this.root.innerHTML = "";
      this.rows = [];
      this.maxCols = Math.max(1, ...lines.map(l => l.length));
      lines.forEach((line, ri) => {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        const units = [];
        for (let i = 0; i < line.length; i++) {
          const isSep = sepCols && lines.length === 1 && sepCols.has(i);
          const u = new Unit(isSep);
          units.push(u);
          rowEl.appendChild(u.el);
        }
        this.root.appendChild(rowEl);
        this.rows.push(units);
      });
      this.fit();
      return true;
    }
    // cascade=true → airport flutter: each cell flaps through random
    // characters, with later cells flapping longer so the board resolves
    // in a left-to-right, top-to-bottom wave.
    render(lines, cascade = false) {
      const total = this.rows.reduce((a, r) => a + r.length, 0);
      let idx = 0;
      lines.forEach((line, ri) => {
        const units = this.rows[ri];
        if (!units) { return; }
        for (let i = 0; i < units.length; i++) {
          let steps = 1;
          if (cascade) {
            const wave = total > 1 ? idx / (total - 1) : 0;     // 0 → 1 across the board
            steps = 7 + Math.round(wave * 13) + Math.floor(Math.random() * 4); // ~7–24 flaps
          }
          units[i].set(line[i] || " ", steps);
          idx++;
        }
      });
    }
    fit() {
      const stage = document.getElementById("stage");
      const cs = getComputedStyle(stage);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      const availW = stage.clientWidth - padX;
      const availH = stage.clientHeight - padY;
      const cols = this.maxCols;
      const rows = this.rows.length || 1;
      // unit width 0.78em, gap 0.09em, unit height 1.12em, row gap 0.16em (em == font-size)
      const widthPerEm = cols * 0.78 + (cols - 1) * 0.09;
      const heightPerEm = rows * 1.12 + (rows - 1) * 0.16;
      let font = Math.min(availW / widthPerEm, availH / heightPerEm);
      font = Math.min(font, 220); // cap
      font = Math.max(font, 8);
      this.root.style.fontSize = font + "px";
      this.root.style.setProperty("--persp", (font * 3) + "px");
      this.root.querySelectorAll(".unit").forEach(u => u.style.setProperty("--half", HALF_MS + "ms"));
    }
    // Settled state of every cell, for image export.
    snapshot() {
      return this.rows.map(r => r.map(u => ({ ch: u.current, sep: u.isSep })));
    }
  }

  // ---------- Sound (mechanical tick via WebAudio) ----------
  let audioCtx = null;
  function tick() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const dur = 0.03;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
    }
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 1.2;
    const g = audioCtx.createGain(); g.gain.value = 0.18;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t);
  }

  // ---------- App ----------
  const board = new Board(document.getElementById("board"));
  const caption = document.getElementById("caption");

  // ----- URL config (shareable links & embeds) -----
  function b64urlEncode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  // Compact, positional config to keep shareable URLs short:
  // [modeCode, paletteIndex, ...mode-specific fields]
  const MODE_CODE = { clock: "c", countdown: "d", message: "m" };
  const CODE_MODE = { c: "clock", d: "countdown", m: "message" };
  function encodeCfg() {
    const arr = [MODE_CODE[state.mode], Math.max(0, PALETTE_KEYS.indexOf(state.palette))];
    if (state.mode === "clock") {
      arr.push(state.clockFormat === "12" ? 1 : 0, state.clockSeconds ? 1 : 0);
    } else if (state.mode === "countdown") {
      arr.push(state.cdEnd || 0, state.cdDuration || 0, state.cdDone || "");
    } else {
      arr.push(state.message || "");
    }
    return b64urlEncode(JSON.stringify(arr));
  }
  function decodeCfg(s) {
    try {
      const a = JSON.parse(b64urlDecode(s));
      if (!Array.isArray(a)) return null;
      const o = { mode: CODE_MODE[a[0]] || "clock" };
      if (PALETTE_KEYS[a[1]]) o.palette = PALETTE_KEYS[a[1]];
      if (o.mode === "clock") {
        o.clockFormat = a[2] ? "12" : "24";
        o.clockSeconds = !!a[3];
      } else if (o.mode === "countdown") {
        o.cdEnd = a[2] || null;
        o.cdDuration = a[3] || 600;
        o.cdDone = a[4] || "TIMES UP";
      } else {
        o.message = a[2] || " ";
      }
      return o;
    } catch { return null; }
  }
  function parseHash() {
    const h = location.hash.replace(/^#/, "");
    const out = {};
    h.split("&").forEach(p => {
      if (!p) return;
      const i = p.indexOf("=");
      out[i < 0 ? p : p.slice(0, i)] = i < 0 ? "" : p.slice(i + 1);
    });
    return out;
  }

  const HASH = parseHash();
  const IS_EMBED = HASH.e === "1";
  const URL_CFG = HASH.s ? decodeCfg(HASH.s) : null;

  const state = Object.assign({
    mode: "clock",
    clockFormat: "24",
    clockSeconds: true,
    sound: false,
    palette: "onyx",
    cdTarget: null,       // ms timestamp, or null
    cdDuration: 600,      // seconds, fallback
    cdEnd: null,          // active end timestamp
    cdDone: "TIMES UP",
    message: "HELLO WORLD",
  }, IS_EMBED ? {} : loadState(), URL_CFG || {});

  // Migrate from the old two-theme setting, and guard against unknown palettes.
  if (!PALETTES[state.palette]) {
    state.palette = state.theme === "light" ? "departures" : "onyx";
  }
  delete state.theme;

  function loadState() {
    try { return JSON.parse(localStorage.getItem("flipit") || "{}"); }
    catch { return {}; }
  }
  function saveState() {
    if (IS_EMBED) return; // embeds are driven by the URL, never persist
    try { localStorage.setItem("flipit", JSON.stringify(state)); } catch {}
  }

  // ----- Rendering per mode -----
  let tickHandle = null;

  function pad(n, w = 2) { return String(n).padStart(w, "0"); }

  function clockString() {
    const d = new Date();
    let h = d.getHours();
    let suffix = "";
    if (state.clockFormat === "12") {
      suffix = h >= 12 ? " PM" : " AM";
      h = h % 12; if (h === 0) h = 12;
    }
    let s = pad(h) + ":" + pad(d.getMinutes());
    if (state.clockSeconds) s += ":" + pad(d.getSeconds());
    s += suffix;
    return s;
  }

  function buildSepCols(str) {
    const set = new Set();
    for (let i = 0; i < str.length; i++) if (str[i] === ":") set.add(i);
    return set;
  }

  function renderClock() {
    const str = clockString();
    const sep = buildSepCols(str);
    board.setLayout([str], sep);
    board.render([str]);
    caption.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }

  function countdownString(remainingSec) {
    const r = Math.max(0, Math.floor(remainingSec));
    const days = Math.floor(r / 86400);
    const h = Math.floor((r % 86400) / 3600);
    const m = Math.floor((r % 3600) / 60);
    const s = r % 60;
    if (days > 0) return pad(days) + ":" + pad(h) + ":" + pad(m) + ":" + pad(s);
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function renderCountdown() {
    if (!state.cdEnd) {
      const str = countdownString(state.cdDuration);
      board.setLayout([str], buildSepCols(str));
      board.render([str]);
      caption.textContent = "Set a target, then press Start";
      return;
    }
    const remaining = (state.cdEnd - Date.now()) / 1000;
    if (remaining <= 0) {
      const done = sanitize(state.cdDone).trim() || "DONE";
      board.setLayout([done]);
      board.render([done], true);   // flutter into the finished label
      caption.textContent = "Finished";
      state.cdEnd = null;
      saveState();
      if (state.sound) { tick(); setTimeout(tick, 140); setTimeout(tick, 280); }
      return;
    }
    const str = countdownString(remaining);
    board.setLayout([str], buildSepCols(str));
    board.render([str]);
    const end = new Date(state.cdEnd);
    caption.textContent = "Until " + end.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function sanitize(str) {
    return str.toUpperCase().split("").map(c => VALID.has(c) ? c : (c === "\n" ? "\n" : " ")).join("");
  }

  function layoutMessage(text) {
    const raw = sanitize(text).replace(/\r/g, "");
    const lines = raw.split("\n").map(l => l.replace(/\s+$/,""));
    // Center each line within the widest line, clamp width
    const width = Math.min(Math.max(1, ...lines.map(l => l.length)), 40);
    const padded = lines.slice(0, 8).map(l => {
      l = l.slice(0, width);
      const total = width - l.length;
      const left = Math.floor(total / 2);
      return " ".repeat(left) + l + " ".repeat(total - left);
    });
    return padded.length ? padded : [" "];
  }

  function renderMessage() {
    const lines = layoutMessage(state.message);
    board.setLayout(lines);
    board.render(lines, true);   // airport-style flutter
    caption.textContent = "Message";
  }

  function startLoop() {
    stopLoop();
    if (state.mode === "clock") {
      renderClock();
      tickHandle = setInterval(renderClock, 250);
    } else if (state.mode === "countdown") {
      renderCountdown();
      tickHandle = setInterval(renderCountdown, 250);
    } else {
      renderMessage();
    }
  }
  function stopLoop() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  // ----- Mode switching -----
  function setMode(mode) {
    state.mode = mode;
    saveState();
    document.querySelectorAll("#modes button").forEach(b =>
      b.classList.toggle("active", b.dataset.mode === mode));
    document.querySelectorAll("#panel [data-panel]").forEach(p =>
      p.style.display = p.dataset.panel === mode ? "" : "none");
    board.layoutKey = ""; // force relayout
    startLoop();
  }

  // ---------- UI wiring ----------
  document.querySelectorAll("#modes button").forEach(b =>
    b.addEventListener("click", () => setMode(b.dataset.mode)));

  const panel = document.getElementById("panel");
  document.getElementById("gearBtn").addEventListener("click", () => {
    panel.classList.toggle("hidden");
    if (!panel.classList.contains("hidden")) {
      document.getElementById("palettePop").classList.add("hidden");
      document.getElementById("exportPop").classList.add("hidden");
    }
  });

  // Sound
  window.__flipSound = null;
  const soundBtn = document.getElementById("soundBtn");
  function applySound() {
    soundBtn.classList.toggle("on", state.sound);
    window.__flipSound = state.sound ? tick : null;
  }
  soundBtn.addEventListener("click", () => {
    state.sound = !state.sound; saveState(); applySound();
    if (state.sound) tick(); // unlock audio + sample
  });

  // Palette
  const themeBtn = document.getElementById("themeBtn");
  const palettePop = document.getElementById("palettePop");
  const swatches = document.getElementById("swatches");

  function applyPalette() {
    const pal = PALETTES[state.palette] || PALETTES.onyx;
    for (const [k, v] of Object.entries(pal.vars)) {
      document.body.style.setProperty("--" + k, v);
    }
    document.body.classList.toggle("light", !!pal.light);
    swatches.querySelectorAll(".swatch").forEach(s =>
      s.classList.toggle("active", s.dataset.key === state.palette));
  }

  function buildSwatches() {
    swatches.innerHTML = "";
    PALETTE_KEYS.forEach(key => {
      const p = PALETTES[key];
      const el = document.createElement("button");
      el.className = "swatch";
      el.dataset.key = key;
      el.title = p.name;
      el.style.background = `linear-gradient(180deg, ${p.vars["card-top"]}, ${p.vars["card-bot-2"]})`;
      el.style.setProperty("--sw-glyph", p.vars.glyph);
      el.style.setProperty("--sw-accent", p.vars.accent);
      el.innerHTML = `<span class="sw-glyph">8</span><span class="sw-hinge"></span><span class="sw-dot"></span><span class="sw-name">${p.name}</span>`;
      el.addEventListener("click", () => {
        state.palette = key; saveState(); applyPalette();
      });
      swatches.appendChild(el);
    });
  }

  const exportPop = document.getElementById("exportPop");

  themeBtn.addEventListener("click", () => {
    palettePop.classList.toggle("hidden");
    if (!palettePop.classList.contains("hidden")) { panel.classList.add("hidden"); exportPop.classList.add("hidden"); }
  });

  // Fullscreen
  document.getElementById("fsBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  // ----- Export & share -----
  function baseURL() { return location.origin + location.pathname; }
  function shareURL(extra) { return baseURL() + "#s=" + encodeCfg() + (extra || ""); }

  // Board proportions in a fixed font-size space, used by both image + embed sizing.
  function boardMetrics(snap) {
    const F = 150;
    const m = { F, uW: 0.78 * F, uH: 1.12 * F, gap: 0.09 * F, rowGap: 0.16 * F,
                rad: 0.08 * F, glyph: 0.82 * F, sepW: 0.4 * F, margin: 0.6 * F };
    const rowW = cells => cells.reduce((w, c, i) => w + (c.sep ? m.sepW : m.uW) + (i ? m.gap : 0), 0);
    m.boardW = Math.max(1, ...snap.map(rowW));
    m.boardH = snap.length * m.uH + (snap.length - 1) * m.rowGap;
    m.W = m.boardW + m.margin * 2;
    m.H = m.boardH + m.margin * 2;
    m.rowW = rowW;
    return m;
  }

  function refreshExport() {
    document.getElementById("shareLink").textContent = shareURL();
    const snap = board.snapshot();
    const m = boardMetrics(snap);
    const ew = 640;
    const eh = Math.round(ew * m.H / m.W);
    document.getElementById("embedCode").textContent =
      `<iframe src="${shareURL("&e=1")}" width="${ew}" height="${eh}" style="border:0;border-radius:16px;max-width:100%" title="Flipit" loading="lazy"></iframe>`;
  }

  function drawBoardToCanvas(scale) {
    const snap = board.snapshot();
    const m = boardMetrics(snap);
    const pal = (PALETTES[state.palette] || PALETTES.onyx).vars;
    const FONT = '"Helvetica Neue", Arial, sans-serif';
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(m.W * scale);
    canvas.height = Math.round(m.H * scale);
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    // Background (approx of the page's radial gradient).
    const bg = ctx.createLinearGradient(0, 0, 0, m.H);
    bg.addColorStop(0, pal["bg-1"]); bg.addColorStop(1, pal["bg-0"]);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, m.W, m.H);

    const rr = (x, y, w, h, r) => {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
      else {
        ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      }
    };

    let y = m.margin;
    snap.forEach(cells => {
      let x = m.margin + (m.boardW - m.rowW(cells)) / 2;
      cells.forEach(c => {
        const w = c.sep ? m.sepW : m.uW;
        if (!c.sep) {
          ctx.save();
          rr(x, y, w, m.uH, m.rad);
          ctx.clip();
          const gt = ctx.createLinearGradient(0, y, 0, y + m.uH / 2);
          gt.addColorStop(0, pal["card-top"]); gt.addColorStop(1, pal["card-top-2"]);
          ctx.fillStyle = gt; ctx.fillRect(x, y, w, m.uH / 2);
          const gb = ctx.createLinearGradient(0, y + m.uH / 2, 0, y + m.uH);
          gb.addColorStop(0, pal["card-bot"]); gb.addColorStop(1, pal["card-bot-2"]);
          ctx.fillStyle = gb; ctx.fillRect(x, y + m.uH / 2, w, m.uH / 2);
          ctx.restore();
          // hinge
          ctx.fillStyle = pal["hinge"];
          ctx.fillRect(x, y + m.uH / 2 - 1, w, 2);
        }
        // glyph
        if (c.ch && c.ch !== " ") {
          ctx.fillStyle = pal["glyph"];
          ctx.font = `700 ${m.glyph}px ${FONT}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(c.ch, x + w / 2, y + m.uH / 2 + m.glyph * 0.02);
        }
        x += w + m.gap;
      });
      y += m.uH + m.rowGap;
    });
    return canvas;
  }

  function downloadImage() {
    const canvas = drawBoardToCanvas(2);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "flipit-" + state.mode + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");
  }

  document.getElementById("exportBtn").addEventListener("click", () => {
    const willOpen = exportPop.classList.contains("hidden");
    exportPop.classList.toggle("hidden");
    if (willOpen) { refreshExport(); panel.classList.add("hidden"); palettePop.classList.add("hidden"); }
  });
  document.getElementById("downloadImg").addEventListener("click", downloadImage);
  exportPop.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const text = document.getElementById(btn.dataset.copy).textContent;
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch {}
        ta.remove();
      }
      const orig = btn.textContent;
      btn.textContent = "Copied!"; btn.classList.add("copied");
      setTimeout(() => { btn.textContent = orig; btn.classList.remove("copied"); }, 1400);
    });
  });

  // ----- Close popovers when clicking outside them -----
  const POPOVERS = [
    { pop: panel, btn: document.getElementById("gearBtn") },
    { pop: palettePop, btn: themeBtn },
    { pop: exportPop, btn: document.getElementById("exportBtn") },
  ];
  document.addEventListener("pointerdown", (e) => {
    POPOVERS.forEach(({ pop, btn }) => {
      if (!pop.classList.contains("hidden") && !pop.contains(e.target) && !btn.contains(e.target)) {
        pop.classList.add("hidden");
      }
    });
  });

  // Clock controls
  const clockFormat = document.getElementById("clockFormat");
  clockFormat.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    state.clockFormat = b.dataset.v; saveState();
    clockFormat.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
    board.layoutKey = ""; renderClock();
  }));
  const clockSeconds = document.getElementById("clockSeconds");
  clockSeconds.addEventListener("change", () => {
    state.clockSeconds = clockSeconds.checked; saveState();
    board.layoutKey = ""; renderClock();
  });

  // Countdown controls
  document.getElementById("cdStart").addEventListener("click", () => {
    const targetVal = document.getElementById("cdTarget").value;
    if (targetVal) {
      const t = new Date(targetVal).getTime();
      if (!isNaN(t)) { state.cdEnd = t; state.cdTarget = targetVal; }
    } else {
      const h = +document.getElementById("cdH").value || 0;
      const m = +document.getElementById("cdM").value || 0;
      const s = +document.getElementById("cdS").value || 0;
      const secs = h * 3600 + m * 60 + s;
      state.cdDuration = secs;
      state.cdEnd = Date.now() + secs * 1000;
    }
    state.cdDone = document.getElementById("cdDone").value || "TIMES UP";
    saveState();
    board.layoutKey = "";
    panel.classList.add("hidden");
    startLoop();
  });

  // Message controls
  const msgText = document.getElementById("msgText");
  function showMessage() {
    state.message = msgText.value || " ";
    saveState();
    // Don't force a rebuild: when the board dimensions are unchanged,
    // setLayout keeps the existing cells so only the letters that
    // actually changed flip from their old character to the new one.
    renderMessage();
  }
  document.getElementById("msgShow").addEventListener("click", () => { showMessage(); panel.classList.add("hidden"); });
  let msgTimer = null;
  msgText.addEventListener("input", () => {
    clearTimeout(msgTimer);
    msgTimer = setTimeout(showMessage, 400);
  });

  // ---------- Idle / auto-hide controls ----------
  let idleTimer = null;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const anyOpen = !panel.classList.contains("hidden") ||
                      !document.getElementById("palettePop").classList.contains("hidden") ||
                      !document.getElementById("exportPop").classList.contains("hidden");
      if (!anyOpen) document.body.classList.add("idle");
    }, 3000);
  }
  ["mousemove", "touchstart", "keydown", "click"].forEach(e =>
    window.addEventListener(e, wake, { passive: true }));
  wake();

  // Keyboard shortcuts
  window.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "f") document.getElementById("fsBtn").click();
    if (e.key === "1") setMode("clock");
    if (e.key === "2") setMode("countdown");
    if (e.key === "3") setMode("message");
    if (e.key === "s") soundBtn.click();
    if (e.key === "t") {
      const i = PALETTE_KEYS.indexOf(state.palette);
      state.palette = PALETTE_KEYS[(i + 1) % PALETTE_KEYS.length];
      saveState(); applyPalette();
    }
  });

  // ---------- Init ----------
  function hydrateInputs() {
    clockFormat.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.v === state.clockFormat));
    clockSeconds.checked = state.clockSeconds;
    document.getElementById("cdDone").value = state.cdDone;
    if (state.cdTarget) document.getElementById("cdTarget").value = state.cdTarget;
    msgText.value = state.message;
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => board.fit(), 120);
  });

  // Embed mode: strip the chrome and lock to the URL config.
  document.body.classList.toggle("embed", IS_EMBED);
  // For a shared (non-embed) link, apply the config once then clean the URL so
  // the visitor's own later tweaks (saved locally) win on refresh.
  if (!IS_EMBED && URL_CFG) {
    try { history.replaceState(null, "", baseURL()); } catch {}
  }

  hydrateInputs();
  applySound();
  buildSwatches();
  applyPalette();
  setMode(state.mode);
})();
</script>
</body>
</html>
